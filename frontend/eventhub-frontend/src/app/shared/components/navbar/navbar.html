<nav class="navbar">
  <div class="navbar-container">
    <div class="navbar-brand">
      <a [routerLink]="isAdmin ? '/dashboard' : '/events'" class="brand-link">
        <span class="brand-icon">🎟️</span>
        <span class="brand-title">EventHub</span>
      </a>
    </div>

    <div class="navbar-menu">
      @if (isAdmin) {
        <a routerLink="/dashboard" routerLinkActive="active" class="nav-item">Dashboard</a>
        <a routerLink="/events" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-item">Events</a>
        <a routerLink="/admin/users" routerLinkActive="active" class="nav-item">Users</a>
        <a routerLink="/admin/registrations" routerLinkActive="active" class="nav-item">Registrations</a>
      } @else {
        <a routerLink="/events" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-item">Events</a>
        <a routerLink="/events/my-registrations" routerLinkActive="active" class="nav-item">My Registrations</a>
      }
    </div>

    <div class="navbar-user">
      <div class="user-badge">
        <span class="user-name">{{ userName }}</span>
        <span class="role-pill" [class.admin-pill]="isAdmin" [class.student-pill]="!isAdmin">
          {{ userRole }}
        </span>
      </div>
      <button class="logout-btn" (click)="logout()" title="Log out">
        Logout
      </button>
    </div>
  </div>
</nav>
