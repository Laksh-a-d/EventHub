<div class="login-container">

  <div class="login-card">

    <h1>EventHub</h1>

    <p class="subtitle">
      Event Management System
    </p>

    <h2>Login</h2>

    <form (ngSubmit)="login()">

      <div class="form-group">

        <label for="email">
          Email
        </label>

        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="Enter your email"
          required
        />

      </div>

      <div class="form-group">

        <label for="password">
          Password
        </label>

        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Enter your password"
          required
        />

      </div>

      @if (errorMessage) {
        <div class="error-message">
          {{ errorMessage }}
        </div>
      }

      <button
        type="submit"
        [disabled]="isLoading">

        @if (isLoading) {
          Logging in...
        } @else {
          Login
        }

      </button>

    </form>

  </div>

</div>
