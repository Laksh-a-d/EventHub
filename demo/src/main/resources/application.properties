spring.application.name=demo

# =========================
# Datasource Configuration
# Supports Railway PostgreSQL & Local Fallback
# =========================
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/newpp}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${PGUSER:${POSTGRES_USER:postgres}}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${PGPASSWORD:${POSTGRES_PASSWORD:2107038}}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# =========================
# Server Configuration
# =========================
server.port=${PORT:8080}

# =========================
# JWT Configuration
# =========================
jwt.secret=${JWT_SECRET:MDEyMzQ1Njc4OUFCQ0RFRjAxMjM0NTY3ODlBQkNERUYwMTIzNDU2Nzg5QUJDREVG}

# =========================
# CORS Configuration
# =========================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,https://*.vercel.app}